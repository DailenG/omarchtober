name: Bug report
description: Report a reproducible Omarchtober problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Omarchtober version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Content mode
      options: [Fun, Scary, Both, Not applicable]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Exact steps, dimensions, terminal, and configuration needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
