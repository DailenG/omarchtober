name: Scene proposal
description: Propose an original illustrated scene plate
labels: [scene]
body:
  - type: input
    id: name
    attributes:
      label: Original scene name
    validations:
      required: true
  - type: textarea
    id: concept
    attributes:
      label: Composition and depth layers
      description: Describe location, focal structure, foreground framing, horizon, and sky without referencing protected film properties.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Content safety
      description: Confirm the plate stays family-safe; no blood, remains, zombies, threatening faces, weapons, or pursuit.
    validations:
      required: true
  - type: textarea
    id: palette
    attributes:
      label: Collection fit
      description: How does it match midnight navy, ivory moonlight, lavender etching, amber lamps, and dense stippling?
    validations:
      required: true
  - type: textarea
    id: ambience
    attributes:
      label: Ambience
      description: Optional notes on the audio mood that suits the plate.
